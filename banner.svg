<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="auto" role="img" aria-label="solar bypasser, fast, free">
  <defs>
    <!-- Clip rect for typewriter reveal of the main message -->
    <clipPath id="msgClip">
      <rect x="60" y="50" width="0" height="80">
        <animate attributeName="width"
                 values="0;0;340;340;0;0"
                 keyTimes="0;0.038;0.192;0.346;0.423;1"
                 dur="13s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- Clip rect for typewriter reveal of the URL -->
    <clipPath id="urlClip">
      <rect x="60" y="50" width="0" height="80">
        <animate attributeName="width"
                 values="0;0;460;460;0"
                 keyTimes="0;0.500;0.731;0.962;1"
                 dur="13s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Pure black background -->
  <rect width="800" height="220" fill="#000000"/>

  <!-- Thin red accent lines (top & bottom) -->
  <rect x="0" y="0"   width="800" height="1" fill="#cc0000"/>
  <rect x="0" y="219" width="800" height="1" fill="#cc0000"/>

  <!-- Typewriter line: solar bypasser (light gray, large) -->
  <text x="60" y="100"
        font-family="'Courier New', Courier, monospace"
        font-size="36" font-weight="bold"
        fill="#e8e8e8" letter-spacing="2"
        clip-path="url(#msgClip)">
    solar bypasser
  </text>

  <!-- Typewriter line: URL (red, medium) -->
  <text x="60" y="100"
        font-family="'Courier New', Courier, monospace"
        font-size="28"
        fill="#cc0000" letter-spacing="1"
        clip-path="url(#urlClip)">
    solarbypasser.vercel.app
  </text>

  <!-- Cursor: blinking red bar that follows the typed text -->
  <!-- Group opacity hides cursor during pause & final URL delete -->
  <g>
    <animate attributeName="opacity"
             values="0;1;0;1;0"
             keyTimes="0;0.038;0.423;0.500;0.962"
             dur="13s"
             calcMode="discrete"
             repeatCount="indefinite"/>
    <rect x="60" y="68" width="3" height="36" fill="#cc0000">
      <!-- Rapid blink -->
      <animate attributeName="opacity"
               values="1;0"
               keyTimes="0;0.5"
               dur="0.8s"
               calcMode="discrete"
               repeatCount="indefinite"/>
      <!-- Cursor x follows the right edge of the currently typed text -->
      <animate attributeName="x"
               values="60;60;400;400;60;60;520;520;60"
               keyTimes="0;0.038;0.192;0.346;0.423;0.500;0.731;0.962;1"
               dur="13s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Static tagline at bottom -->
  <text x="400" y="190" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="14" fill="#444444" letter-spacing="8">
    fast · free
  </text>
</svg>
